<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards — Learning Bahasa Indonesian</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --card:#f9fafb;
    --again:#dc2626; --hard:#d97706; --good:#16a34a; --easy:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --fg:#e7e9ee; --muted:#9aa1ac; --line:#2a2e37; --accent:#5b9dff;
      --card:#1a1d24; --again:#f87171; --hard:#fbbf24; --good:#4ade80; --easy:#7cb0ff; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:28px 20px 60px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  h1 { font-size:1.15rem; margin:0; }
  a.back { color:var(--muted); font-size:0.8rem; text-decoration:none; }
  .stats { color:var(--muted); font-size:0.8rem; margin-bottom:16px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .panel { border:1px solid var(--line); border-radius:10px; background:var(--card);
    padding:12px; margin-bottom:16px; }
  .panel[hidden] { display:none; }
  #searchBox { width:100%; font-size:0.85rem; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); padding:8px 10px; margin-bottom:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  button.chip { font-size:0.75rem; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg); color:var(--muted); cursor:pointer; }
  button.chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.chip:hover { border-color:var(--accent); }
  button.chip .n { opacity:0.65; font-size:0.68rem; margin-left:4px; }
  .panelFoot { margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .panelFoot .count { color:var(--muted); font-size:0.75rem; }
  .browseList { max-height:58vh; overflow-y:auto; margin:-4px -4px 0; }
  .browseRow { display:flex; justify-content:space-between; gap:10px; align-items:baseline;
    padding:9px 6px; border-bottom:1px solid var(--line); cursor:pointer; }
  .browseRow:last-child { border-bottom:none; }
  .browseRow:hover { background:var(--bg); }
  .browseRow .bmain { min-width:0; }
  .browseRow .bf { font-weight:600; font-size:0.9rem; }
  .browseRow .bb { color:var(--muted); font-size:0.78rem; }
  .browseRow .bs { font-size:0.7rem; white-space:nowrap; flex:0 0 auto; }
  .bs.new { color:var(--accent); }
  .bs.learning { color:var(--hard); }
  .bs.mature { color:var(--good); }
  #card { border:1px solid var(--line); border-radius:14px; background:var(--card);
    min-height:220px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:28px 20px; cursor:pointer; margin:18px 0; user-select:none; }
  #card .front { font-size:1.5rem; font-weight:600; }
  #card .back { display:none; }
  #card.flipped .front { display:none; }
  #card.flipped .back { display:block; }
  /* The Indonesian is echoed above the answer: you're judging recall at the
     moment you rate, so the pair you're trying to associate has to be on
     screen together rather than the prompt vanishing on flip. */
  #card .back .q { color:var(--muted); font-size:0.95rem; margin-bottom:10px; }
  #card .back .en { font-size:1.25rem; font-weight:600; margin-bottom:6px; }
  #card .back .tag { color:var(--muted); font-size:0.78rem; }
  #card .back .ex, #card .back .heard { margin-top:14px; padding-top:12px;
    border-top:1px dashed var(--line); font-size:0.88rem; line-height:1.5; }
  #card .back .ex b, #card .back .heard b { color:var(--accent); }
  #card .back .ex .exEn, #card .back .heard .exEn { color:var(--muted); font-size:0.8rem; margin-top:3px; }
  #card .back .ex:empty, #card .back .heard:empty { display:none; }
  /* The recording is unedited family speech — often a fragment, sometimes
     mistranscribed. Labelled and dimmed so it reads as evidence, not as the
     model sentence sitting above it. */
  #card .back .heard { color:var(--muted); font-size:0.82rem; }
  #card .back .heard .heardLbl { font-size:0.66rem; letter-spacing:0.06em;
    text-transform:uppercase; opacity:0.75; margin-bottom:4px; }
  .playRow { display:flex; align-items:center; gap:10px; justify-content:center;
    margin:-6px 0 14px; }
  button.playBtn { font-size:0.82rem; padding:7px 13px; border-radius:8px;
    border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
  button.playBtn:hover { background:var(--accent); color:#fff; }
  button.playBtn:disabled { border-color:var(--line); color:var(--muted);
    background:transparent; cursor:default; }
  .playNote { color:var(--muted); font-size:0.72rem; }
  .hint { text-align:center; color:var(--muted); font-size:0.78rem; margin-top:-8px; margin-bottom:18px; }
  .rate { display:flex; gap:8px; }
  button.rate-btn { flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); font-size:0.85rem; cursor:pointer; display:flex;
    flex-direction:column; align-items:center; gap:2px; }
  button.rate-btn:hover { filter:brightness(1.1); }
  button.rate-btn .prev { font-size:0.7rem; opacity:0.7; }
  button.rate-btn.again { border-color:var(--again); color:var(--again); }
  button.rate-btn.hard { border-color:var(--hard); color:var(--hard); }
  button.rate-btn.good { border-color:var(--good); color:var(--good); }
  button.rate-btn.easy { border-color:var(--easy); color:var(--easy); }
  .rate[hidden] { display:none; }
  /* Sits well clear of the rate buttons and right-aligned rather than centred
     under them — it used to be a full-width tap target directly beneath
     "Again", which is a thumb misfire waiting to happen on a phone. */
  .cardMeta { text-align:right; margin-top:22px; }
  .cardMeta[hidden] { display:none; }
  button.linkBtn { font-size:0.72rem; color:var(--muted); background:none; border:none;
    cursor:pointer; padding:4px; }
  button.linkBtn:hover { color:var(--again); text-decoration:underline; }
  .tools { display:flex; justify-content:space-between; align-items:center; margin-top:24px;
    flex-wrap:wrap; gap:8px; }
  .tools .row { display:flex; gap:8px; flex-wrap:wrap; }
  button.plain { font-size:0.78rem; padding:6px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--muted); cursor:pointer; }
  button.plain:disabled { opacity:0.4; cursor:default; }
  button.plain.active { border-color:var(--accent); color:var(--accent); }
  button.plain.danger:hover { border-color:var(--again); color:var(--again); }
  .empty { color:var(--muted); font-size:0.9rem; text-align:center; margin-top:20px; }
  .empty .sub { font-size:0.8rem; margin-top:6px; }
  .empty button.plain { margin-top:14px; }

  #addForm, #bulkForm { border:1px solid var(--line); border-radius:10px; background:var(--card);
    padding:14px; margin:0 0 16px; }
  #addForm[hidden], #bulkForm[hidden] { display:none; }
  #addForm input, #bulkForm textarea { width:100%; margin-bottom:8px; font-size:0.85rem; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:8px 10px; }
  #bulkForm textarea { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; min-height:160px; resize:vertical; }
  #bulkForm .hint2 { font-size:0.75rem; color:var(--muted); margin:-4px 0 8px; }
  #addForm .row, #bulkForm .row { display:flex; gap:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Flashcards</h1>
    <a class="back" href="index.html">&larr; all conversations</a>
  </div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <button class="plain" id="filterToggleBtn">Filter</button>
    <button class="plain" id="browseToggleBtn">Browse</button>
    <button class="plain" id="addToggleBtn">+ Card</button>
    <button class="plain" id="bulkToggleBtn">+ List</button>
  </div>
  <div class="panel" id="filterPanel" hidden>
    <input id="searchBox" placeholder="Search Indonesian or English…">
    <div class="chips" id="tagChips"></div>
    <div class="panelFoot">
      <span class="count" id="filterCount"></span>
      <button class="plain" id="clearFilterBtn">Clear filters</button>
    </div>
  </div>
  <div class="panel" id="browsePanel" hidden>
    <div class="browseList" id="browseList"></div>
    <div class="panelFoot">
      <span class="count" id="browseCount"></span>
      <button class="plain" id="browseCloseBtn">Close</button>
    </div>
  </div>
  <div id="addForm" hidden>
    <input id="addFront" placeholder="Indonesian (e.g. kayaknya)">
    <input id="addBack" placeholder="English / notes">
    <input id="addTag" placeholder="tags, comma-separated (optional — defaults to “custom”)">
    <div class="row">
      <button class="plain" id="addSaveBtn">Save card</button>
      <button class="plain" id="addCancelBtn">Cancel</button>
    </div>
  </div>
  <div id="bulkForm" hidden>
    <div class="hint2">One per line: <code>front – back</code>. Start a block with <code>(tag)</code> to
      tag everything below it until the next blank line or <code>(tag)</code> — blocks without one default
      to “custom”. Words that already exist in the deck get the new tag added rather than duplicated.</div>
    <textarea id="bulkText" placeholder="(comparison)
lebih – more
kurang – less / not enough
paling – most

(connector)
dan – and
atau – or"></textarea>
    <div class="row">
      <button class="plain" id="bulkSaveBtn">Import list</button>
      <button class="plain" id="bulkCancelBtn">Cancel</button>
    </div>
  </div>
  <div id="card"><div class="front"></div><div class="back"><div class="q"></div><div class="en"></div><div class="tag"></div><div class="ex"></div><div class="heard"></div></div></div>
  <div class="playRow">
    <button class="playBtn" id="playBtn">&#9654; Hear it</button>
    <span class="playNote" id="playNote"></span>
  </div>
  <div class="hint" id="hint"></div>
  <div class="rate" id="rateRow" hidden>
    <button class="rate-btn again" id="btn1"><span class="lbl">Again</span><span class="prev" id="prev1"></span></button>
    <button class="rate-btn hard" id="btn2"><span class="lbl">Hard</span><span class="prev" id="prev2"></span></button>
    <button class="rate-btn good" id="btn3"><span class="lbl">Good</span><span class="prev" id="prev3"></span></button>
    <button class="rate-btn easy" id="btn4"><span class="lbl">Easy</span><span class="prev" id="prev4"></span></button>
  </div>
  <div class="cardMeta" id="cardMeta" hidden>
    <button class="linkBtn" id="removeBtn">Remove card</button>
  </div>
  <audio id="cardAudio" preload="none"></audio>
  <div class="tools">
    <div class="row">
      <button class="plain" id="undoBtn" disabled>&#8630; Go back</button>
      <button class="plain" id="restoreBtn">Restore removed (0)</button>
    </div>
    <div class="row">
      <span class="stats" id="syncState"></span>
      <span class="stats" id="deckInfo"></span>
      <button class="plain danger" id="resetBtn">Reset progress</button>
    </div>
  </div>
</div>
<script>

const DAY_MS = 24 * 60 * 60 * 1000;
const RELEARN_MS = 10 * 60 * 1000;
const MATURE_STABILITY_DAYS = 21;
const DESIRED_RETENTION = 0.9;

const FSRS_W = [
  0.40255, 1.18385, 3.173, 15.69105, 7.1949,
  0.5345, 1.4604, 0.0046, 1.54575, 0.1192,
  1.01925, 1.9395, 0.11, 0.29605, 2.2698,
  0.2315, 2.9898, 0.51655, 0.6621
];
const FSRS_F = 19 / 81;
const FSRS_C = -0.5;

function srsLoad(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
}
function srsSave(key, s) { localStorage.setItem(key, JSON.stringify(s)); }

function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
function clampD(d) { return clamp(d, 1, 10); }

function fsrsRetrievability(elapsedDays, stability) {
  if (elapsedDays <= 0) return 1;
  return Math.pow(1 + FSRS_F * (elapsedDays / stability), FSRS_C);
}

// Days until retrievability decays to `desiredR` starting from `stability`.
function fsrsIntervalDays(desiredR, stability) {
  return (stability / FSRS_F) * (Math.pow(desiredR, 1 / FSRS_C) - 1);
}

function fsrsInitialDifficulty(g) {
  return clampD(FSRS_W[4] - Math.exp(FSRS_W[5] * (g - 1)) + 1);
}
function fsrsInitialStability(g) {
  return FSRS_W[g - 1]; // W[0..3] are literally the four initial-stability values
}

function fsrsUpdateDifficulty(D, g) {
  const deltaD = -FSRS_W[6] * (g - 3);
  const dPrime = D + deltaD * ((10 - D) / 9);
  const mixed = FSRS_W[7] * fsrsInitialDifficulty(4) + (1 - FSRS_W[7]) * dPrime;
  return clampD(mixed);
}

function fsrsUpdateStability(S, D, R, g) {
  if (g === 1) {
    // Lapse: new stability can't exceed the pre-lapse stability.
    const sMin = FSRS_W[11] * Math.pow(D, -FSRS_W[12]) *
      (Math.pow(S + 1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14] * (1 - R));
    return Math.min(sMin, S);
  }
  const hardPenalty = g === 2 ? FSRS_W[15] : 1;
  const easyBonus = g === 4 ? FSRS_W[16] : 1;
  const growth = 1 + hardPenalty * easyBonus * Math.exp(FSRS_W[8]) *
    (11 - D) * Math.pow(S, -FSRS_W[9]) * (Math.exp(FSRS_W[10] * (1 - R)) - 1);
  return S * growth;
}

function fsrsUpdateSameDayStability(S, g) {
  return S * Math.exp(FSRS_W[17] * (g - 3 + FSRS_W[18]));
}

// Pure: computes the resulting state for grade g without touching storage.
// state is null/undefined for a never-reviewed card.
function fsrsNextState(state, g, now) {
  if (!state || !state.stability) {
    const S = fsrsInitialStability(g);
    const D = fsrsInitialDifficulty(g);
    const due = g === 1 ? now + RELEARN_MS : now + fsrsIntervalDays(DESIRED_RETENTION, S) * DAY_MS;
    return { difficulty: D, stability: S, due, lastReview: now, reps: g === 1 ? 0 : 1 };
  }
  const elapsedDays = Math.max(0, (now - state.lastReview) / DAY_MS);
  const R = fsrsRetrievability(elapsedDays, state.stability);
  const D = fsrsUpdateDifficulty(state.difficulty, g);
  const S = elapsedDays < 1
    ? fsrsUpdateSameDayStability(state.stability, g)
    : fsrsUpdateStability(state.stability, state.difficulty, R, g);
  const due = g === 1 ? now + RELEARN_MS : now + fsrsIntervalDays(DESIRED_RETENTION, S) * DAY_MS;
  const reps = g === 1 ? 0 : (state.reps || 0) + 1;
  return { difficulty: D, stability: S, due, lastReview: now, reps };
}

// { 1: 'Again', 2: 'Hard', 3: 'Good', 4: 'Easy' } -> formatted next-interval string,
// for showing an Anki-style preview on each rating button.
function fsrsPreviewLabels(state, now) {
  const out = {};
  for (let g = 1; g <= 4; g++) {
    const next = fsrsNextState(state, g, now);
    out[g] = srsFmtInterval(next.due - now);
  }
  return out;
}

function srsIsDue(state) {
  return !state || !state.due || state.due <= Date.now();
}
function srsIsMature(state) {
  return !!(state && state.stability >= MATURE_STABILITY_DAYS);
}

// ---- Daily new-card cap ----------------------------------------------------
// Removed (2026-07-19) — new cards are no longer rationed. srsNewQuotaLeft()
// stays as a no-op returning Infinity so every caller (flashcards/quiz/study
// all do `.slice(0, srsNewQuotaLeft())` or `quota === 0` checks) keeps
// working unchanged without gating on it.
function srsNewQuotaLeft() {
  return Infinity;
}
function srsNoteNewIntroduced() {}

// ---- Review log (feeds streak/heatmap/retention stats) ---------------------
// Map keyed by ms-timestamp -> {g: grade 1-4, k: kind, n: 1 if first-ever
// review of that item}. Capped to the newest LOG_CAP entries; synced across
// devices as a union (see _sync_js.py) so streaks survive switching devices.
const REVIEWLOG_KEY = 'bahasa:reviewLog:v1';
const REVIEWLOG_CAP = 2000;

// Returns the key it logged under, so an undo can take the entry back out.
// `itemKey` (the item's SRS id) is recorded so stats can join a review back to
// the card it belongs to — that's what makes retention-by-tag possible.
// Entries written before this existed simply have no `i` and are skipped by
// those breakdowns rather than miscounted.
function srsLogReview(kind, grade, isNew, itemKey) {
  const log = srsLoad(REVIEWLOG_KEY);
  let t = Date.now();
  while (log[t]) t++;
  log[t] = { g: grade, k: kind, n: isNew ? 1 : 0 };
  if (itemKey) log[t].i = itemKey;
  const keys = Object.keys(log).map(Number).sort((a, b) => b - a);
  if (keys.length > REVIEWLOG_CAP) {
    for (const k of keys.slice(REVIEWLOG_CAP)) delete log[k];
  }
  srsSave(REVIEWLOG_KEY, log);
  return t;
}

// ---- Undo ------------------------------------------------------------------
// Rating is the only destructive action in the study UIs: it overwrites an
// item's FSRS state and appends a review-log entry. "Go back" restores both,
// so a misclicked "Again" doesn't leave a wrecked schedule behind. The stack
// is in-memory on purpose — it's for the misclick you just made, not
// cross-session history.
const UNDO_CAP = 30;
let srsUndoStack = [];

function srsPushUndo(entry) {
  srsUndoStack.push(entry);
  if (srsUndoStack.length > UNDO_CAP) srsUndoStack.shift();
}
function srsPopUndo() { return srsUndoStack.pop() || null; }
function srsUndoDepth() { return srsUndoStack.length; }

// An undo rewrites an item to an *older* state, which would normally lose the
// sync merge to the rated copy this device may already have pushed (the merge
// keeps whichever side was reviewed later). `rev` marks "this was written
// locally at time T" without touching lastReview, which FSRS reads as when the
// item was genuinely last reviewed. See syncMergeFsrs in _sync_js.py.
// Returns null when the item had no prior state (it was brand new), which the
// caller turns into a delete rather than a write.
function srsRestoreState(prev) {
  return prev ? Object.assign({}, prev, { rev: Date.now() }) : null;
}

// ---- Forward stack ---------------------------------------------------------
// The card an undo pushed off the screen. Flashcards and the quiz draw the
// next item at random, so without this, going back and re-rating would hand
// you a *different* card than the one you were already looking at — the undo
// would quietly reshuffle your place in the deck.
//
// LIFO, so consecutive undos replay forwards in the right order: rate A (see
// B), rate B (see C), undo, undo — now re-rating A gives back B, and B gives
// back C.
let srsForwardStack = [];

function srsPushForward(item) {
  if (item) srsForwardStack.push(item);
}
function srsClearForward() { srsForwardStack = []; }
function srsForwardDepth() { return srsForwardStack.length; }

// `resolve` re-looks-up the queued item and returns it (or a falsy value if
// it's no longer eligible — filtered out, removed, or edited away). Skips past
// anything stale rather than showing a card that isn't in the current pool.
function srsTakeForward(resolve) {
  while (srsForwardStack.length) {
    const found = resolve(srsForwardStack.pop());
    if (found) return found;
  }
  return null;
}

// Removes a review-log entry by the key srsLogReview returned, so an undone
// rating doesn't keep inflating the streak/recall stats.
function srsUnlogReview(ts) {
  if (!ts) return;
  const log = srsLoad(REVIEWLOG_KEY);
  if (!(ts in log)) return;
  delete log[ts];
  srsSave(REVIEWLOG_KEY, log);
}

// ---- Daily goal ------------------------------------------------------------
// A target number of reviews per day. Deliberately a soft goal shown on the
// landing page, not a cap that stops you (the hard 15/day new-card cap was
// removed on purpose) — it exists to make "am I done for today?" answerable.
// Device-local: it's a display preference, not progress, so it stays out of
// SYNC_KEYS and each device can set its own.
const GOAL_KEY = 'bahasa:dailyGoal:v1';
const DEFAULT_GOAL = 30;

function srsDayKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function srsGoal() {
  const g = srsLoad(GOAL_KEY);
  return g && g.n ? g.n : DEFAULT_GOAL;
}
function srsSetGoal(n) {
  srsSave(GOAL_KEY, { n: Math.max(1, Math.round(n)) });
}
function srsReviewsToday() {
  const today = srsDayKey(new Date());
  const log = srsLoad(REVIEWLOG_KEY);
  let n = 0;
  for (const ts of Object.keys(log)) {
    if (srsDayKey(new Date(Number(ts))) === today) n++;
  }
  return n;
}

// ---- Device ----------------------------------------------------------------
// Touch devices have no space bar and no "z" key, but they do have the swipe
// gestures — so the on-screen hints have to say different things. `hover:none`
// is the right signal (it means "no mouse"); screen width is not, since a
// narrow desktop window still has a keyboard.
function srsIsTouch() {
  return !!(window.matchMedia && window.matchMedia('(hover: none)').matches);
}

// Separate from srsIsTouch on purpose: whether a panel should start collapsed
// is a *layout* question (is there room?), while hint wording is an *input*
// question (is there a keyboard?). A narrow desktop window needs the collapse
// but still wants the keyboard hints.
function srsIsNarrow() {
  return window.innerWidth < 640;
}

function srsFmtDue(ts) {
  if (!isFinite(ts)) return 'later';
  return srsFmtInterval(ts - Date.now());
}
function srsFmtInterval(ms) {
  if (ms <= 0) return 'now';
  const mins = Math.round(ms / 60000);
  if (mins < 60) return mins + 'm';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h';
  const days = Math.round(hrs / 24);
  if (days < 30) return days + 'd';
  const months = Math.round(days / 30);
  if (months < 12) return months + 'mo';
  return (Math.round(months / 12 * 10) / 10) + 'y';
}

// One-time migration from the old simplified-SM2 state (ease/interval/reps,
// no difficulty/stability) into FSRS state, then removes the legacy key.
// Items with reps >= 1 are seeded as if their most recent rating was "Good"
// (grade 3), using their old interval as a stability floor, and are put up
// for immediate re-review under the new model rather than guessing a
// mapping that doesn't really exist between the two systems.
function srsMigrateLegacy(srsKey, legacyKeys) {
  let srs = srsLoad(srsKey);
  for (const legacyKey of legacyKeys) {
    const legacy = srsLoad(legacyKey);
    if (!Object.keys(legacy).length) continue;
    for (const [id, v] of Object.entries(legacy)) {
      if (srs[id]) continue;
      const hasProgress = v && ((v.reps || 0) >= 1 || (v.box || 0) >= 1);
      const S = hasProgress ? Math.max(fsrsInitialStability(3), v.interval || 0) : fsrsInitialStability(3);
      srs[id] = {
        difficulty: fsrsInitialDifficulty(3),
        stability: S,
        due: Date.now(),
        lastReview: Date.now(),
        reps: hasProgress ? 1 : 0,
      };
    }
    localStorage.removeItem(legacyKey);
  }
  srsSave(srsKey, srs);
  return srs;
}


const SYNC_FORMAT = 1;
const SYNC_APP_ID = 'learning-bahasa-indonesian';
const FSRS_KEYS = ['bahasa:flashcards:fsrs:v1', 'bahasa:quiz:fsrs:v1'];
const FLAG_KEY = 'bahasa:flaggedLines:v1';
const REMOVED_CARDS_KEY = 'bahasa:flashcards:removed:v1';
const CUSTOM_CARDS_KEY = 'bahasa:flashcards:custom:v1';
// REVIEWLOG_KEY is declared in the SRS module, which is always embedded
// before this one on pages that have both; index.html embeds only this
// module, so declare a local fallback name instead of referencing it.
const SYNC_REVIEWLOG_KEY = 'bahasa:reviewLog:v1';
const SYNC_KEYS = [...FSRS_KEYS, FLAG_KEY, REMOVED_CARDS_KEY, CUSTOM_CARDS_KEY, SYNC_REVIEWLOG_KEY];

function syncRead(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
}
function syncWrite(key, v) { localStorage.setItem(key, JSON.stringify(v)); }

function syncBuildExport() {
  const data = {};
  SYNC_KEYS.forEach(k => { data[k] = syncRead(k); });
  return {
    app: SYNC_APP_ID,
    formatVersion: SYNC_FORMAT,
    exportedAt: Date.now(),
    exportedAtISO: new Date().toISOString(),
    data,
  };
}

// How recently a record was written. Normally that's its lastReview, but an
// undo deliberately restores an *older* state and stamps it with `rev` (see
// srsRestoreState in _srs_js.py) so it isn't instantly re-clobbered by the
// rated copy already sitting on the remote.
function syncStamp(r) {
  return Math.max((r && r.lastReview) || 0, (r && r.rev) || 0);
}

// Per item id, keep whichever side was written more recently.
function syncMergeFsrs(local, incoming) {
  const out = Object.assign({}, local);
  let added = 0, updated = 0, kept = 0;
  for (const [id, inc] of Object.entries(incoming || {})) {
    const cur = out[id];
    if (!cur) { out[id] = inc; added++; continue; }
    if (syncStamp(inc) > syncStamp(cur)) { out[id] = inc; updated++; }
    else kept++;
  }
  return { out, added, updated, kept };
}

function syncMergeFlags(local, incoming) {
  const out = Object.assign({}, local);
  let added = 0;
  for (const id of Object.keys(incoming || {})) {
    if (!out[id]) { out[id] = incoming[id]; added++; }
  }
  return { out, added };
}

// Generic version of syncMergeFsrs's rule (later `field` wins) for any
// id -> {..., [field]: timestamp} map — used for custom flashcards, keyed by
// `updatedAt` instead of `lastReview`.
function syncMergeByField(local, incoming, field) {
  const out = Object.assign({}, local);
  let added = 0, updated = 0, kept = 0;
  for (const [id, inc] of Object.entries(incoming || {})) {
    const cur = out[id];
    if (!cur) { out[id] = inc; added++; continue; }
    if ((inc[field] || 0) > (cur[field] || 0)) { out[id] = inc; updated++; }
    else kept++;
  }
  return { out, added, updated, kept };
}

// Returns a human-readable summary, or throws with a useful message.
function syncApplyImport(payload) {
  if (!payload || typeof payload !== 'object') throw new Error('That file isn\'t valid JSON.');
  if (payload.app !== SYNC_APP_ID) {
    throw new Error('That file isn\'t a Bahasa Player progress export.');
  }
  if ((payload.formatVersion || 0) > SYNC_FORMAT) {
    throw new Error('That export came from a newer version of the app than this one.');
  }
  const bits = [];
  let touched = 0;
  for (const key of FSRS_KEYS) {
    const r = syncMergeFsrs(syncRead(key), (payload.data || {})[key]);
    syncWrite(key, r.out);
    touched += r.added + r.updated;
    const label = key.includes('flashcards') ? 'flashcards' : 'quiz items';
    bits.push(`${label}: ${r.added} new, ${r.updated} updated, ${r.kept} already newer here`);
  }
  const f = syncMergeFlags(syncRead(FLAG_KEY), (payload.data || {})[FLAG_KEY]);
  syncWrite(FLAG_KEY, f.out);
  touched += f.added;
  bits.push(`flagged lines: ${f.added} new`);

  const rm = syncMergeFlags(syncRead(REMOVED_CARDS_KEY), (payload.data || {})[REMOVED_CARDS_KEY]);
  syncWrite(REMOVED_CARDS_KEY, rm.out);
  touched += rm.added;
  bits.push(`removed flashcards: ${rm.added} new`);

  const cc = syncMergeByField(syncRead(CUSTOM_CARDS_KEY), (payload.data || {})[CUSTOM_CARDS_KEY], 'updatedAt');
  syncWrite(CUSTOM_CARDS_KEY, cc.out);
  touched += cc.added + cc.updated;
  bits.push(`custom flashcards: ${cc.added} new, ${cc.updated} updated, ${cc.kept} already newer here`);

  // Review log: union by timestamp key, then trim to the newest 2000 so the
  // payload can't grow without bound.
  const lg = syncMergeFlags(syncRead(SYNC_REVIEWLOG_KEY), (payload.data || {})[SYNC_REVIEWLOG_KEY]);
  const lgKeys = Object.keys(lg.out).map(Number).sort((a, b) => b - a);
  for (const k of lgKeys.slice(2000)) delete lg.out[k];
  syncWrite(SYNC_REVIEWLOG_KEY, lg.out);
  touched += lg.added;

  const when = payload.exportedAtISO ? new Date(payload.exportedAtISO).toLocaleString() : 'unknown date';
  return { touched, text: `Merged export from ${when}.\n` + bits.join('\n') };
}

function syncCounts() {
  const fc = Object.keys(syncRead('bahasa:flashcards:fsrs:v1')).length;
  const qz = Object.keys(syncRead('bahasa:quiz:fsrs:v1')).length;
  const fl = Object.keys(syncRead(FLAG_KEY)).length;
  return { fc, qz, fl };
}

// ---- Remote auto-sync via a private GitHub Gist ----------------------------
// The gist holds exactly one file (SYNC_FILENAME) whose content is the same
// payload syncBuildExport() produces, so pull can reuse syncApplyImport().
// Token requirement: a CLASSIC personal-access token with only the `gist`
// scope (fine-grained tokens can't access the gist API). Stored in this
// browser's localStorage only.

const SYNC_TOKEN_KEY = 'bahasa:sync:token';
const SYNC_GIST_KEY = 'bahasa:sync:gistId';
const SYNC_LAST_KEY = 'bahasa:sync:lastSync';
const SYNC_FILENAME = 'bahasa-progress.json';
const GH_API = 'https://api.github.com';

function syncRemoteConfigured() {
  return !!(localStorage.getItem(SYNC_TOKEN_KEY) && localStorage.getItem(SYNC_GIST_KEY));
}
function syncGhHeaders() {
  return {
    'Authorization': 'Bearer ' + localStorage.getItem(SYNC_TOKEN_KEY),
    'Accept': 'application/vnd.github+json',
  };
}

// Find this browser's user's progress gist, or create it. Stores token+id.
async function syncRemoteSetup(token) {
  const headers = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' };
  let resp = await fetch(GH_API + '/gists?per_page=100', { headers });
  if (resp.status === 401) throw new Error('GitHub rejected that token. Is it a classic token with the gist scope?');
  if (!resp.ok) throw new Error('GitHub error ' + resp.status + ' while listing gists.');
  const gists = await resp.json();
  let gist = gists.find(g => g.files && g.files[SYNC_FILENAME]);
  if (!gist) {
    resp = await fetch(GH_API + '/gists', {
      method: 'POST', headers,
      body: JSON.stringify({
        description: 'Bahasa Player progress sync (created automatically)',
        public: false,
        files: { [SYNC_FILENAME]: { content: JSON.stringify(syncBuildExport()) } },
      }),
    });
    if (!resp.ok) throw new Error('Could not create the sync gist (HTTP ' + resp.status + '). Does the token have the gist scope?');
    gist = await resp.json();
  }
  localStorage.setItem(SYNC_TOKEN_KEY, token);
  localStorage.setItem(SYNC_GIST_KEY, gist.id);
  return gist.id;
}

async function syncRemotePull() {
  const id = localStorage.getItem(SYNC_GIST_KEY);
  const resp = await fetch(GH_API + '/gists/' + id, { headers: syncGhHeaders() });
  if (resp.status === 404) throw new Error('Sync gist not found — it may have been deleted. Disconnect and reconnect.');
  if (!resp.ok) throw new Error('Pull failed (HTTP ' + resp.status + ').');
  const gist = await resp.json();
  const file = gist.files && gist.files[SYNC_FILENAME];
  if (!file) return { touched: 0, text: 'Remote gist has no progress file yet.' };
  let content = file.content;
  if (file.truncated) content = await (await fetch(file.raw_url)).text();
  let payload;
  try { payload = JSON.parse(content); } catch (e) { return { touched: 0, text: 'Remote progress file was unreadable; it will be overwritten on next push.' }; }
  const r = syncApplyImport(payload);
  localStorage.setItem(SYNC_LAST_KEY, String(Date.now()));
  return r;
}

// Pull-merge first so this device's push can never clobber another device's
// newer reviews, then upload the merged state.
async function syncRemotePush() {
  try { await syncRemotePull(); } catch (e) { /* offline pull is fine; push may still work */ }
  const id = localStorage.getItem(SYNC_GIST_KEY);
  const resp = await fetch(GH_API + '/gists/' + id, {
    method: 'PATCH', headers: syncGhHeaders(),
    body: JSON.stringify({ files: { [SYNC_FILENAME]: { content: JSON.stringify(syncBuildExport()) } } }),
  });
  if (!resp.ok) throw new Error('Push failed (HTTP ' + resp.status + ').');
  localStorage.setItem(SYNC_LAST_KEY, String(Date.now()));
}

let _syncPushTimer = null;
function syncRemoteQueuePush(statusCb) {
  if (!syncRemoteConfigured()) return;
  if (_syncPushTimer) clearTimeout(_syncPushTimer);
  statusCb && statusCb('pending');
  _syncPushTimer = setTimeout(async () => {
    _syncPushTimer = null;
    try { await syncRemotePush(); statusCb && statusCb('ok'); }
    catch (e) { statusCb && statusCb('err'); }
  }, 2500);
}

// Best-effort flush if the tab is backgrounded while a push is still queued.
// Skips the pre-pull; keepalive bodies are size-capped (~64KB) so this can
// silently no-op on very large state — the next normal push covers it.
async function syncRemoteFlush() {
  const id = localStorage.getItem(SYNC_GIST_KEY);
  if (!id) return;
  try {
    await fetch(GH_API + '/gists/' + id, {
      method: 'PATCH', headers: syncGhHeaders(), keepalive: true,
      body: JSON.stringify({ files: { [SYNC_FILENAME]: { content: JSON.stringify(syncBuildExport()) } } }),
    });
    localStorage.setItem(SYNC_LAST_KEY, String(Date.now()));
  } catch (e) { /* best effort */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && _syncPushTimer) {
    clearTimeout(_syncPushTimer);
    _syncPushTimer = null;
    syncRemoteFlush();
  }
});

// Page-load hook: pull, merge, and let the page refresh its UI if anything
// actually changed.
async function syncRemoteAutoPull(onMerged, statusCb) {
  if (!syncRemoteConfigured()) return;
  statusCb && statusCb('pending');
  try {
    const r = await syncRemotePull();
    statusCb && statusCb('ok');
    if (r.touched && onMerged) onMerged(r);
  } catch (e) { statusCb && statusCb('err'); }
}

function syncRemoteDisconnect() {
  localStorage.removeItem(SYNC_TOKEN_KEY);
  localStorage.removeItem(SYNC_GIST_KEY);
  localStorage.removeItem(SYNC_LAST_KEY);
}


const ttsHasSupport = typeof window.speechSynthesis !== 'undefined'
  && typeof window.SpeechSynthesisUtterance !== 'undefined';
let ttsVoice = null;

// Voices load asynchronously in most browsers, and an Indonesian voice may
// simply not be installed — in which case the default voice would read
// Indonesian with English phonics and teach the wrong pronunciation. Callers
// are expected to disable their play button and say so, rather than fall back
// to an English voice.
function ttsPickVoice() {
  if (!ttsHasSupport) return null;
  const vs = window.speechSynthesis.getVoices() || [];
  ttsVoice = vs.find(v => /^id\b|^id[-_]/i.test(v.lang)) || null;
  return ttsVoice;
}

// Re-picks on the browser's async voice load, then hands control back so the
// page can refresh whatever UI depends on voice availability.
function ttsOnVoicesChanged(cb) {
  if (!ttsHasSupport) return;
  ttsPickVoice();
  window.speechSynthesis.addEventListener('voiceschanged', () => { ttsPickVoice(); cb(); });
}

function ttsStop() {
  if (ttsHasSupport) window.speechSynthesis.cancel();
}

// Slightly under normal speed: fast enough to sound like speech, slow enough
// that the syllable boundaries are still audible to a learner.
function ttsSpeak(text, rate) {
  if (!ttsVoice || !text) return false;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = ttsVoice;
  u.lang = ttsVoice.lang;
  u.rate = rate || 0.9;
  window.speechSynthesis.speak(u);
  return true;
}

// One place that decides what to tell the user about a synthetic voice, so
// flashcards and quiz can never drift into describing it differently.
function ttsUnavailableNote() {
  return ttsHasSupport
    ? 'no Indonesian voice installed on this device'
    : 'speech synthesis unavailable';
}

// custom cards are layered in (a custom card with the same front as a
// built-in one edits it in place, since it wins the Map merge below).

function loadCustomCards() { return syncRead(CUSTOM_CARDS_KEY); }

// device) may still have a single `tag` string — normalize on read.

  if (Array.isArray(d.tags) && d.tags.length) return d;
  return Object.assign({}, d, { tags: d.tag ? [d.tag] : ['custom'] });

  const removed = loadRemovedCards();

const rateRow = document.getElementById('rateRow');
const cardMeta = document.getElementById('cardMeta');

// union of those categories (a card matches if it carries ANY active tag,
// so cross-tagged cards let categories mix).
let activeTags = new Set();
let searchTerm = '';

  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Chips are an explicit "show me this category" action, so they always draw a

// mid-word, so it only re-picks once the card on screen stops matching.
function afterFilterChange(forcePick) {
  srsClearForward();

// Re-derive the deck after a local edit (add/remove) or a remote sync pull

  renderChips();

  applyFilter();
  pickNext();

// Pull any progress made on another device, then refresh what's on screen.
syncRemoteAutoPull(() => {

  refreshDeck();

function dueIn(items) { return items.filter(d => srsIsDue(srs[d.front])); }

function pickNext() {
  if (!pool.length) { renderEmpty('No cards for this tag.'); return; }
  // If an undo displaced a card, give that one back rather than drawing a
  // fresh random one — otherwise "Go back" loses your place in the deck.
  const queued = srsTakeForward(c => pool.find(d => d.front === c.front));
  if (queued) { showCard(queued); return; }
  // Reviews first, then any brand-new card; practice-ahead ignores the
  // schedule entirely once even that pool is exhausted.
  const reviews = pool.filter(d => srs[d.front] && srsIsDue(srs[d.front]));
  const freshAll = pool.filter(d => !srs[d.front]);
  let due = reviews.length ? reviews : freshAll;
  if (practiceAhead && !due.length) due = pool;
  if (!due.length) { renderAllCaughtUp(); return; }
  let next = due[Math.floor(Math.random() * due.length)];
  if (due.length > 1 && current && next.front === current.front) next = due[Math.floor(Math.random() * due.length)];

  cardEl.querySelector('.en').textContent = current.back;
  cardEl.querySelector('.tag').textContent = current.tags.join(' · ');

  // give the answer away before you've committed to one.

function renderEmpty(msg) {

  rateRow.hidden = true;

function renderAllCaughtUp() {
  current = null;

  updatePlayRow();

  const nextDue = Math.min(...dues);

  // Deliberately whole-deck, ignoring the tag filter (matches quiz.html's
  // pattern) — deckInfo below is where the filtered count lives, so these
  // numbers stay internally consistent regardless of what's selected.
  const dueReviews = DECK.filter(d => srs[d.front] && srsIsDue(srs[d.front])).length;
  const fresh = DECK.filter(d => !srs[d.front]).length;
  const mature = DECK.filter(d => srsIsMature(srs[d.front])).length;
  document.getElementById('stats').textContent =
    `${DECK.length} cards — ${dueReviews} to review, ${fresh} new, ${mature} mastered (21d+)`;

function updatePreviews() {
  if (!current) return;
  const labels = fsrsPreviewLabels(srs[current.front], Date.now());
  for (let g = 1; g <= 4; g++) document.getElementById('prev' + g).textContent = labels[g];

function flip() {
  if (!current) return;
  flipped = !flipped;

  rateRow.hidden = !flipped;
  cardMeta.hidden = !flipped;

function rate(grade) {

  srsPushUndo({ card: current, front: current.front, prev: srs[current.front] || null, ts });
  srs[current.front] = fsrsNextState(srs[current.front], grade, Date.now());

  syncRemoteQueuePush(setSyncState);
  practiceAhead = false;

  // to it instead of a random draw.

  const restored = srsRestoreState(u.prev);
  if (restored) srs[u.front] = restored; else delete srs[u.front];

// A list view over the current filter, so a 274-card deck is something you can
// actually look at rather than only meeting one card at a time. Rows show
// scheduling state; clicking one jumps straight to studying that card.
function cardStateLabel(front) {
  const s = srs[front];
  if (!s) return { txt: 'new', cls: 'new' };
  if (srsIsMature(s)) return { txt: 'mastered · ' + srsFmtDue(s.due), cls: 'mature' };
  return { txt: srsIsDue(s) ? 'due now' : 'in ' + srsFmtDue(s.due), cls: 'learning' };

  const listEl = document.getElementById('browseList');
  if (!pool.length) {
    listEl.innerHTML = '<div class="empty">Nothing matches.</div>';
  } else {
    listEl.innerHTML = pool.map((d, i) => {
      const st = cardStateLabel(d.front);

        `<div class="bmain"><div class="bf">${escapeHtml(d.front)}</div>` +
        `<div class="bb">${escapeHtml(d.back)}</div></div>` +

// Filter / Browse / Add card / Add list are mutually exclusive so they never
// stack up and push the card off screen.
const PANEL_IDS = ['filterPanel', 'browsePanel', 'addForm', 'bulkForm'];

function closePanels(except) {

    .classList.toggle('active', id === 'browsePanel' && willOpen);

// Two sources, deliberately distinguishable. Cards whose word actually occurs
// in the recording play the family saying it, in context — that's the point of
// the project. The rest (most of the standalone reference decks) fall back to
// the device's Indonesian speech synthesis, which is clearly labelled so a
// synthetic voice is never mistaken for how these people really talk.
const cardAudio = document.getElementById('cardAudio');
const playBtn = document.getElementById('playBtn');
const playNote = document.getElementById('playNote');
let stopAt = null;

cardAudio.addEventListener('timeupdate', () => {
  if (stopAt !== null && cardAudio.currentTime >= stopAt) { cardAudio.pause(); stopAt = null; }
});

function updatePlayRow() {
  if (!current) { playBtn.disabled = true; playNote.textContent = ''; return; }
  if (current.audio) {
    playBtn.disabled = false;
    playBtn.innerHTML = '&#9654; Hear it';
    playNote.textContent = 'real recording';
  } else if (ttsVoice) {
    playBtn.disabled = false;
    playBtn.innerHTML = '&#128266; Hear it';
    // Once flipped there's a whole sentence worth hearing, not just the word.
    playNote.textContent = flipped && current.example
      ? 'example sentence · synthesized'
      : 'synthesized — not from the recording';
  } else {
    playBtn.disabled = true;
    playBtn.innerHTML = '&#128266; Hear it';
    playNote.textContent = ttsUnavailableNote();
  }
}

function stopAudio() {
  cardAudio.pause();
  stopAt = null;
  ttsStop();
}

function playCurrent() {
  if (!current) return;
  if (current.audio) {
    ttsStop();
    if (!cardAudio.paused) { cardAudio.pause(); stopAt = null; return; }
    stopAt = current.nextSec;
    const start = () => { cardAudio.currentTime = current.sec; cardAudio.play(); };
    if (cardAudio.src.endsWith(current.audio) && cardAudio.readyState >= 1) {
      start();
    } else {
      cardAudio.src = current.audio;
      cardAudio.addEventListener('loadedmetadata', start, { once: true });
      cardAudio.load();
    }
    return;
  }
  cardAudio.pause();
  // Before the flip you're being asked to recall the word, so hearing the word
  // is the useful prompt; after it, the sentence is what's worth modelling.
  ttsSpeak(flipped && current.example ? current.example : current.front);
}

  document.getElementById('hint').textContent = srsIsTouch()

function removeCurrentCard() {
  if (!current) return;
  const front = current.front;
  const custom = loadCustomCards();
  const isCustom = !!custom[front];
  const msg = isCustom
    ? `Delete your custom card "${front}"? This can't be undone.`
    : `Remove "${front}" from your deck? You can bring it back later with "Restore removed".`;
  if (!confirm(msg)) return;
  if (isCustom) {
    delete custom[front];
    syncWrite(CUSTOM_CARDS_KEY, custom);
  } else {
    const removed = loadRemovedCards();
    removed[front] = true;
    syncWrite(REMOVED_CARDS_KEY, removed);
  }
  delete srs[front];
  srsSave(SRS_KEY, srs);
  syncRemoteQueuePush(setSyncState);
  refreshDeck();
}

  const custom = loadCustomCards();
  custom[front] = { front, back, tags, updatedAt: Date.now() };
  syncWrite(CUSTOM_CARDS_KEY, custom);
  // If this front was previously removed (a built-in card), un-tombstone it —
  // saving a card with that name is an explicit signal to bring it back.
  const removed = loadRemovedCards();
  if (removed[front]) { delete removed[front]; syncWrite(REMOVED_CARDS_KEY, removed); }
  syncRemoteQueuePush(setSyncState);
  return true;
}


// Parses the same "front – back" paste format used to build the vocab/*.tsv
// decks: blank-line-separated blocks, each optionally starting with a
// "(tag[,tag2])" line that applies to every entry in that block. Accepts
// en dash / em dash / hyphen as the separator, as long as it's space-padded
// (so hyphenated words like "kira-kira" inside a term are left alone).
function parseBulkVocab(text) {
  const entries = [];
  const blocks = text.split(/\n\s*\n/);
  for (const block of blocks) {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    let tags = ['custom'];
    let start = 0;
    const tagMatch = lines[0].match(/^\(([^)]+)\)$/);
    if (tagMatch) {
      tags = tagMatch[1].split(',').map(t => t.trim()).filter(Boolean);
      if (!tags.length) tags = ['custom'];
      start = 1;
    }
    for (let i = start; i < lines.length; i++) {
      const sep = lines[i].match(/\s[–—-]\s/);
      if (!sep) continue;
      const front = lines[i].slice(0, sep.index).trim();
      const back = lines[i].slice(sep.index + sep[0].length).trim();
      if (front && back) entries.push({ front, back, tags });
    }
  }
  return entries;
}


// Same collision rule as manual TSV edits: a front that already exists
// anywhere in the deck (built-in or custom) gets the new tag(s) merged onto
// its existing row instead of being duplicated or having its back overwritten.
function addBulkCards(entries) {
  if (!entries.length) return { added: 0, retagged: 0 };
  const custom = loadCustomCards();
  const removed = loadRemovedCards();
  let added = 0, retagged = 0;
  for (const e of entries) {
    const existing = DECK.find(d => d.front === e.front);
    if (existing) {
      const mergedTags = [...new Set([...existing.tags, ...e.tags])];
      custom[e.front] = { front: e.front, back: existing.back, tags: mergedTags, updatedAt: Date.now() };
      retagged++;
    } else {
      custom[e.front] = { front: e.front, back: e.back, tags: e.tags, updatedAt: Date.now() };
      added++;
    }
    if (removed[e.front]) delete removed[e.front];
  }
  syncWrite(CUSTOM_CARDS_KEY, custom);
  syncWrite(REMOVED_CARDS_KEY, removed);
  syncRemoteQueuePush(setSyncState);
  return { added, retagged };
}

cardEl.addEventListener('click', flip);
[1, 2, 3, 4].forEach(g => {
  document.getElementById('btn' + g).addEventListener('click', (e) => { e.stopPropagation(); rate(g); });
});
document.getElementById('removeBtn').addEventListener('click', removeCurrentCard);
document.getElementById('undoBtn').addEventListener('click', undoLast);
playBtn.addEventListener('click', (e) => { e.stopPropagation(); playCurrent(); });
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset all flashcard progress (review history and due dates)?')) { srs = {}; srsSave(SRS_KEY, srs); srsClearForward(); pickNext(); }
});
document.getElementById('restoreBtn').addEventListener('click', () => {
  const n = Object.keys(loadRemovedCards()).length;
  if (!n) return;
  if (!confirm(`Restore ${n} removed card(s)?`)) return;
  syncWrite(REMOVED_CARDS_KEY, {});
  syncRemoteQueuePush(setSyncState);
  refreshDeck();
});

const addForm = document.getElementById('addForm');
document.getElementById('addToggleBtn').addEventListener('click', () => {
  if (togglePanel('addForm')) document.getElementById('addFront').focus();
});
document.getElementById('addCancelBtn').addEventListener('click', () => { addForm.hidden = true; });
document.getElementById('addSaveBtn').addEventListener('click', () => {
  const front = document.getElementById('addFront').value;
  const back = document.getElementById('addBack').value;
  const tag = document.getElementById('addTag').value;
  if (!addCustomCard(front, back, tag)) {
    alert('Enter both the Indonesian term and an English gloss.');
    return;
  }
  document.getElementById('addFront').value = '';
  document.getElementById('addBack').value = '';
  document.getElementById('addTag').value = '';
  addForm.hidden = true;
  refreshDeck();
});

const bulkForm = document.getElementById('bulkForm');
document.getElementById('bulkToggleBtn').addEventListener('click', () => {
  if (togglePanel('bulkForm')) document.getElementById('bulkText').focus();
});

document.getElementById('filterToggleBtn').addEventListener('click', () => togglePanel('filterPanel'));
document.getElementById('browseToggleBtn').addEventListener('click', () => togglePanel('browsePanel'));
document.getElementById('browseCloseBtn').addEventListener('click', () => closePanels());

const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', () => {
  searchTerm = searchBox.value.trim().toLowerCase();
  practiceAhead = false;
  afterFilterChange(false);
});
document.getElementById('clearFilterBtn').addEventListener('click', () => {
  activeTags.clear();
  searchTerm = '';
  searchBox.value = '';
  practiceAhead = false;
  renderChips();
  afterFilterChange(true);
});
document.getElementById('bulkCancelBtn').addEventListener('click', () => { bulkForm.hidden = true; });
document.getElementById('bulkSaveBtn').addEventListener('click', () => {
  const entries = parseBulkVocab(document.getElementById('bulkText').value);
  if (!entries.length) {
    alert('No valid lines found. Use the format:\n\nfront – back\n\noptionally starting a block with (tag).');
    return;
  }
  const { added, retagged } = addBulkCards(entries);
  document.getElementById('bulkText').value = '';
  bulkForm.hidden = true;
  refreshDeck();
  alert(`Added ${added} new card(s)` + (retagged ? `, retagged ${retagged} existing word(s).` : '.'));
});

document.addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); flip(); }
  else if (e.key === 'p') playCurrent();
  else if (e.key === 'z') undoLast();
  else if (flipped && ['1','2','3','4'].includes(e.key)) rate(parseInt(e.key, 10));
});

// Swipe-to-rate on touch devices: once flipped, swipe the card right for
// Good, left for Again (the two ratings that cover ~95% of real answers).
let touchX = null, touchY = null;
cardEl.addEventListener('touchstart', (e) => {
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, { passive: true });
cardEl.addEventListener('touchend', (e) => {
  if (touchX === null || !flipped || !current) { touchX = null; return; }
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 40) rate(dx > 0 ? 3 : 1);
});

// On a phone the chip row is the single biggest thing between you and a card
// (15 categories wrap to ~7 rows), so it starts collapsed on any narrow
// screen. Wide windows have the room, so leave it open there.
if (!srsIsTouch() && !srsIsNarrow()) document.getElementById('filterPanel').hidden = false;
renderHint();
updatePlayRow();
updateRestoreCount();
pickNext();
</script>
